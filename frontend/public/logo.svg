<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <linearGradient id="fastGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="slowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="impactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#0f172a" rx="16"/>

  <!-- Card 1: Fast CC Mode -->
  <g transform="translate(20, 25)">
    <rect width="260" height="270" rx="12" fill="url(#fastGrad)" stroke="#10b981" stroke-width="2"/>
    <rect x="15" y="15" width="230" height="32" rx="6" fill="#064e3b"/>
    <text x="130" y="36" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. FAST CC MODE (0% - 80%)</text>
    
    <!-- Sub-box 1 -->
    <rect x="25" y="65" width="210" height="75" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="95" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">60 kW Peak Power</text>
    <text x="130" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Constant Current (CC) Phase</text>

    <!-- Arrow Down -->
    <line x1="130" y1="145" x2="130" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Sub-box 2 -->
    <rect x="25" y="180" width="210" height="75" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="210" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">High Efficiency Bulk</text>
    <text x="130" y="233" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">~25 Mins Duration</text>
  </g>

  <!-- Transition Arrow 1 -->
  <line x1="285" y1="160" x2="315" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Card 2: Slow CV Taper Mode -->
  <g transform="translate(320, 25)">
    <rect width="260" height="270" rx="12" fill="url(#slowGrad)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="15" y="15" width="230" height="32" rx="6" fill="#78350f"/>
    <text x="130" y="36" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. SLOW CV TAPER (80% - 100%)</text>
    
    <!-- Sub-box 1 -->
    <rect x="25" y="65" width="210" height="75" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="95" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Power Drops: 60kW → 8kW</text>
    <text x="130" y="118" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Electrochemical Resistance</text>

    <!-- Arrow Down -->
    <line x1="130" y1="145" x2="130" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Sub-box 2 -->
    <rect x="25" y="180" width="210" height="75" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="210" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Trickle Charge Bottleneck</text>
    <text x="130" y="233" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">+40 Mins for Just 20% SoC</text>
  </g>

  <!-- Transition Arrow 2 -->
  <line x1="585" y1="160" x2="615" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Card 3: System Impact -->
  <g transform="translate(620, 25)">
    <rect width="280" height="270" rx="12" fill="url(#impactGrad)" stroke="#ef4444" stroke-width="2"/>
    <rect x="15" y="15" width="250" height="32" rx="6" fill="#7f1d1d"/>
    <text x="140" y="36" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. CRITICAL SYSTEM IMPACT</text>
    
    <!-- Sub-box 1 -->
    <rect x="20" y="65" width="240" height="85" rx="8" fill="#1e293b" stroke="#ef4444" stroke-opacity="0.4"/>
    <text x="140" y="100" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Station Queues Paralyzed</text>
    <text x="140" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">30+ min unnecessary driver wait times</text>

    <!-- Sub-box 2 -->
    <rect x="20" y="165" width="240" height="85" rx="8" fill="#1e293b" stroke="#ef4444" stroke-opacity="0.4"/>
    <text x="140" y="200" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Transformer Thermal Stress</text>
    <text x="140" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Unmanaged peaks degrade grid assets</text>
  </g>
</svg>
