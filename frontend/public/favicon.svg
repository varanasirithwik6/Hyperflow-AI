<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Core Gradients -->
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Hexagon Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#flowGrad1)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Outer Cyber Orbit Ring (Pulsing Energy Circuit) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="14, 10"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6, 12"/>

  <!-- HyperFlow Infinity Loop (Twin Energy Flow) -->
  <g filter="url(#neonGlow)">
    <!-- Left Loop (Grid & Battery Inflow) -->
    <path d="M 256,256 C 210,170 120,170 120,256 C 120,342 210,342 256,256" 
          fill="none" 
          stroke="url(#flowGrad1)" 
          stroke-width="24" 
          stroke-linecap="round"/>
    
    <!-- Right Loop (Fast Charging Outflow) -->
    <path d="M 256,256 C 302,342 392,342 392,256 C 392,170 302,170 256,256" 
          fill="none" 
          stroke="url(#flowGrad1)" 
          stroke-width="24" 
          stroke-linecap="round"/>
  </g>

  <!-- Central Sharp EV Energy Bolt (Hyper Charging Vector) -->
  <g filter="url(#softShadow)">
    <polygon points="274,110 190,266 250,266 238,402 334,236 266,236" 
             fill="url(#boltGrad)" 
             stroke="#ffffff" 
             stroke-width="4" 
             stroke-linejoin="round"/>
  </g>

  <!-- Glowing Core Nexus Node (AI Digital Twin Brain) -->
  <circle cx="256" cy="256" r="10" fill="#ffffff" filter="url(#neonGlow)"/>
  <circle cx="120" cy="256" r="6" fill="#38bdf8"/>
  <circle cx="392" cy="256" r="6" fill="#10b981"/>
</svg>
